name: Security Audit

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday at 08:00 UTC
  push:
    paths:
      - 'vss-bridge/Cargo.lock'
  workflow_dispatch:        # Manual trigger

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rustsec/audit-check` runs from the repo root and reads
      # `./Cargo.lock`, which we don't have at the root — the crate
      # lives under `vss-bridge/`.  The action has no
      # working-directory input, so we install + invoke cargo-audit
      # ourselves from inside the crate.  `taiki-e/install-action`
      # is a precompiled-binary installer (no `cargo install` build,
      # ~5 s vs ~45 s).
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        working-directory: vss-bridge
        run: cargo audit --deny warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: vss-bridge/Cargo.toml
          command: check
          # cargo-deny 0.19+ rejects `--all-features` at the top
          # level — it's now a per-graph flag and not exposed via
          # `check`.  Drop it; `check` defaults already cover the
          # advisories / bans / licenses / sources surface.
